[package]
name = "peticiones"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
base64 = "0.23.1"
eframe = { version = "0.37", features = ["persistence", "glow"] }
getrandom = "0.4.3"
md-5 = "0.11.0"
rfd = "0.17"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
toml = "1.2.2"
ureq = "3"

# Ícono y datos de versión del .exe (solo al compilar en Windows): ver build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }
